<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MONSTER BURGER · App</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --negro: #080808;
  --carbon: #0f0f0f;
  --carbon-2: #151515;
  --gris-oscuro: #1e1e1e;
  --gris-medio: #2a2a2a;
  --amarillo: #FFD000;
  --naranja: #F36A00;
  --naranja-brillante: #FF7A00;
  --rojo-oscuro: #7A160D;
  --rojo: #A52216;
  --blanco: #FFFFFF;
  --gris-claro: #D6D6D6;

  /* IMPORTANTE: esta variable la actualiza el JS según el dispositivo */
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);

  --nav-height: 68px;
  --header-height: 78px;

  --app-max: 100%;
  --pad-x: 16px;
  --grid-cols: 1;
  --card-thumb: 100px;
}

html, body {
  height: 100%;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  background: var(--negro);
  color: var(--gris-claro);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  position: relative;
  min-height: 100dvh;
}

/* ============ SPLASH ============ */
.splash {
  position: fixed; inset: 0;
  background: radial-gradient(circle at center, #1a0a00 0%, #080808 70%);
  z-index: 9999;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.5s ease, visibility 0.5s ease;
  padding: 20px;
}
.splash.hidden { opacity: 0; visibility: hidden; }
.splash-logo-img {
  width: clamp(160px, 40vw, 260px);
  max-width: 70vw; height: auto;
  margin-bottom: 1.2rem;
  animation: splashBounce 1.2s ease infinite;
  filter: drop-shadow(0 0 40px rgba(255, 208, 0, 0.6));
}
@keyframes splashBounce {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-15px) scale(1.05); }
}
.splash-tag {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 0.85rem; letter-spacing: 5px;
  color: var(--naranja-brillante); margin-top: 0.3rem;
}
.splash-loader {
  margin-top: 2.5rem; width: 120px; height: 3px;
  background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden;
}
.splash-loader::after {
  content: ''; display: block; height: 100%; width: 40%;
  background: linear-gradient(90deg, transparent, var(--amarillo), transparent);
  animation: splashLoad 1.2s ease infinite;
}
@keyframes splashLoad {
  0% { transform: translateX(-150%); }
  100% { transform: translateX(350%); }
}

/* ============ APP BAR ============ */
.app-bar {
  position: fixed; top: 0; left: 0; right: 0;
  width: 100%;
  max-width: var(--app-max);
  margin: 0 auto;
  height: calc(var(--header-height) + var(--safe-top));
  padding-top: var(--safe-top);
  padding-inline: var(--pad-x);
  background: rgba(8, 8, 8, 0.92);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-bottom: 1px solid rgba(255, 208, 0, 0.12);
  z-index: 100;
  display: flex; align-items: center; gap: 10px;
  transition: box-shadow 0.3s;
}
.app-bar.scrolled { box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7); }

.app-brand { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.app-brand-logo {
  height: clamp(46px, 12vw, 66px);
  width: auto; max-width: 48vw;
  display: block; object-fit: contain;
  filter:
    drop-shadow(0 0 16px rgba(255, 208, 0, 0.65))
    drop-shadow(0 0 32px rgba(243, 106, 0, 0.45))
    brightness(1.15) contrast(1.08) saturate(1.12);
  transition: transform 0.25s ease, filter 0.25s ease;
}
.app-brand-logo:active {
  transform: scale(0.94);
  filter:
    drop-shadow(0 0 24px rgba(255, 208, 0, 0.95))
    brightness(1.2) contrast(1.1);
}

.app-search {
  flex: 1;
  display: flex; align-items: center;
  background: var(--carbon-2);
  border: 1px solid var(--gris-medio);
  border-radius: 12px;
  padding: 0 12px; height: 42px;
  transition: all 0.25s ease;
  max-width: 420px;
  margin-left: auto;
  min-width: 0;
}
.app-search:focus-within {
  border-color: var(--amarillo);
  box-shadow: 0 0 0 3px rgba(255, 208, 0, 0.12);
}
.app-search i { color: var(--amarillo); font-size: 0.85rem; margin-right: 8px; }
.app-search input {
  background: transparent; border: none; outline: none;
  color: var(--blanco); font-size: 0.85rem;
  font-family: inherit; width: 100%; min-width: 0;
}
.app-search input::placeholder { color: #555; }

.app-nav-desktop { display: none; }

.app-icon-btn {
  width: 42px; height: 42px;
  background: var(--carbon-2);
  border: 1px solid var(--gris-medio);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: var(--gris-claro);
  cursor: pointer; flex-shrink: 0;
  transition: all 0.2s;
  position: relative;
}
.app-icon-btn:active { transform: scale(0.9); }
@media (hover: hover) {
  .app-icon-btn:hover { border-color: var(--amarillo); color: var(--amarillo); }
}
.app-icon-btn .dot {
  position: absolute; top: 6px; right: 6px;
  width: 8px; height: 8px;
  background: var(--naranja); border-radius: 50%;
  box-shadow: 0 0 8px var(--naranja);
}

/* ============ MAIN ============ */
.app-main {
  max-width: var(--app-max);
  margin: 0 auto;
  padding-top: calc(var(--header-height) + var(--safe-top));
  padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 20px);
  min-height: 100dvh;
}

/* ============ HERO ============ */
.app-hero {
  position: relative;
  padding: 20px var(--pad-x) 24px;
  background:
    radial-gradient(ellipse at top, rgba(243, 106, 0, 0.15) 0%, transparent 60%),
    linear-gradient(180deg, #0a0a0a 0%, #080808 100%);
  overflow: hidden;
}
.app-hero::before {
  content: ''; position: absolute; inset: 0;
  background-image: repeating-linear-gradient(45deg, transparent, transparent 3px, rgba(255,255,255,0.02) 3px, rgba(255,255,255,0.02) 6px);
  pointer-events: none;
}
.app-hero-inner { position: relative; }
.app-hero-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255, 208, 0, 0.12);
  border: 1px solid rgba(255, 208, 0, 0.35);
  color: var(--amarillo);
  font-size: 0.65rem; font-weight: 800;
  letter-spacing: 1.5px; text-transform: uppercase;
  padding: 6px 12px; border-radius: 20px;
  margin-bottom: 12px;
}
.app-hero-title {
  font-family: 'Anton', sans-serif;
  font-size: clamp(1.7rem, 7vw, 2.3rem);
  line-height: 0.95; letter-spacing: -0.5px;
  text-transform: uppercase; color: var(--blanco);
  margin-bottom: 6px;
}
.app-hero-title span { color: var(--amarillo); }
.app-hero-sub {
  font-size: 0.78rem; color: #888;
  letter-spacing: 0.3px; margin-bottom: 16px;
}
.app-hero-ctas { display: flex; gap: 10px; }

.app-btn {
  flex: 1; height: 46px;
  border: none; border-radius: 12px;
  font-family: inherit; font-weight: 800;
  font-size: 0.78rem; letter-spacing: 0.5px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  gap: 8px; transition: all 0.2s;
  text-transform: uppercase;
}
.app-btn:active { transform: scale(0.96); }
.app-btn-primary {
  background: linear-gradient(135deg, var(--amarillo) 0%, var(--naranja-brillante) 100%);
  color: #000;
  box-shadow: 0 4px 20px rgba(255, 208, 0, 0.35);
}
.app-btn-ghost {
  background: transparent; color: var(--amarillo);
  border: 1.5px solid var(--amarillo);
}

.app-carousel {
  display: flex; gap: 12px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding: 0 var(--pad-x) 8px;
  scrollbar-width: none;
  margin-top: 4px;
}
.app-carousel::-webkit-scrollbar { display: none; }
.app-feature {
  flex: 0 0 min(78%, 320px);
  aspect-ratio: 16/9;
  border-radius: 16px; overflow: hidden;
  scroll-snap-align: start;
  position: relative;
  border: 1px solid var(--gris-medio);
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}
.app-feature img {
  width: 100%; height: 100%; object-fit: cover;
  filter: brightness(0.7) contrast(1.1) saturate(1.1);
}
.app-feature-label {
  position: absolute; left: 12px; bottom: 12px;
  font-family: 'Anton', sans-serif; font-size: 1rem;
  color: #fff; text-transform: uppercase;
  letter-spacing: 0.5px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.9);
}
.app-carousel.is-empty { display: none !important; }
.app-feature { cursor: pointer; }
.app-feature-label { right: 12px; display: flex; flex-direction: column; gap: 2px; }
.app-feature-price {
  font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 800;
  color: var(--amarillo); letter-spacing: 0.3px; text-transform: none;
}
.app-feature-tag {
  position: absolute; top: 10px; left: 10px;
  background: linear-gradient(135deg, var(--rojo), var(--naranja));
  color: #fff; font-size: 0.6rem; font-weight: 900;
  letter-spacing: 1px; padding: 4px 10px;
  border-radius: 4px; text-transform: uppercase;
  transform: rotate(-2deg);
}

/* ============ CATEGORÍAS ============ */
.app-cats {
  position: sticky;
  top: calc(var(--header-height) + var(--safe-top));
  z-index: 90;
  background: rgba(8, 8, 8, 0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--gris-oscuro);
  padding: 10px 0;
}
.app-cats-scroll {
  display: flex; gap: 8px;
  overflow-x: auto;
  padding: 0 var(--pad-x);
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.app-cats-scroll::-webkit-scrollbar { display: none; }
.app-cat {
  flex-shrink: 0;
  background: var(--carbon-2);
  border: 1px solid var(--gris-medio);
  color: var(--gris-claro);
  font-family: inherit; font-size: 0.72rem; font-weight: 800;
  letter-spacing: 0.5px;
  padding: 9px 16px; border-radius: 20px;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; gap: 6px;
  text-transform: uppercase; white-space: nowrap;
}
.app-cat:active { transform: scale(0.94); }
.app-cat.active {
  background: linear-gradient(135deg, var(--amarillo) 0%, var(--naranja-brillante) 100%);
  border-color: transparent; color: #000;
  box-shadow: 0 4px 16px rgba(255, 208, 0, 0.4);
}
.app-cat .emoji { font-size: 1rem; line-height: 1; }

/* ============ LISTA PRODUCTOS ============ */
.app-list {
  padding: 14px var(--pad-x) 20px;
  display: grid;
  grid-template-columns: repeat(var(--grid-cols), minmax(0, 1fr));
  gap: 12px;
}
.app-section-title {
  grid-column: 1 / -1;
  font-family: 'Anton', sans-serif;
  font-size: 1.2rem; letter-spacing: 0.5px;
  color: var(--blanco); text-transform: uppercase;
  padding: 4px 4px 0;
  display: flex; align-items: center; gap: 8px;
}
.app-section-title span { color: var(--amarillo); }
.app-section-title::after {
  content: ''; flex: 1; height: 2px;
  background: linear-gradient(90deg, var(--naranja), transparent);
  border-radius: 2px;
}

.product-item {
  display: flex; gap: 12px;
  background: linear-gradient(145deg, var(--carbon-2) 0%, #101010 100%);
  border: 1px solid var(--gris-oscuro);
  border-radius: 16px; padding: 10px;
  position: relative; overflow: hidden;
  transition: all 0.25s ease;
}
.product-item:active {
  transform: scale(0.985);
  border-color: var(--amarillo);
  box-shadow: 0 0 24px rgba(255, 208, 0, 0.15);
}
.product-thumb {
  position: relative;
  width: var(--card-thumb); height: var(--card-thumb);
  flex-shrink: 0; border-radius: 12px;
  overflow: hidden; background: #0a0a0a;
  border: 1px solid var(--gris-oscuro);
}
.product-thumb img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.5s ease;
  filter: brightness(0.98) contrast(1.05) saturate(1.05);
}
.product-item:active .product-thumb img { transform: scale(1.08); }
.product-badge {
  position: absolute; top: 6px; left: 6px;
  background: linear-gradient(135deg, var(--rojo), var(--naranja));
  color: #fff; font-size: 0.55rem; font-weight: 900;
  letter-spacing: 0.5px; padding: 3px 7px;
  border-radius: 4px; text-transform: uppercase;
  transform: rotate(-3deg);
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  z-index: 2;
}
.product-badge.hot { background: linear-gradient(135deg, var(--naranja), var(--rojo-oscuro)); }
.product-badge.new { background: linear-gradient(135deg, var(--amarillo), var(--naranja-brillante)); color: #000; }
.product-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.product-name {
  font-family: 'Anton', sans-serif; font-size: 0.95rem;
  letter-spacing: 0.3px; color: var(--blanco);
  text-transform: uppercase; line-height: 1.1;
  margin-bottom: 4px;
}
.product-desc {
  font-size: 0.72rem; color: #808080; line-height: 1.4;
  margin-bottom: 8px;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
  flex: 1;
}
.product-bottom {
  display: flex; align-items: center;
  justify-content: space-between; gap: 8px;
  margin-top: auto;
}
.product-price {
  font-family: 'Anton', sans-serif;
  font-size: 1.15rem; color: var(--amarillo);
  letter-spacing: 0.3px;
  text-shadow: 0 0 16px rgba(255, 208, 0, 0.3);
  line-height: 1;
}
.product-add {
  width: 38px; height: 38px; border-radius: 12px;
  background: linear-gradient(135deg, var(--amarillo) 0%, var(--naranja-brillante) 100%);
  border: none; color: #000; font-size: 1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  box-shadow: 0 4px 14px rgba(255, 208, 0, 0.35);
  flex-shrink: 0;
}
.product-add:active {
  transform: scale(0.88);
  box-shadow: 0 0 24px rgba(255, 208, 0, 0.7);
}

.app-empty {
  grid-column: 1 / -1;
  text-align: center; padding: 60px 20px; color: #555;
}
.app-empty-emoji {
  font-size: 3.5rem; margin-bottom: 12px;
  filter: drop-shadow(0 0 20px rgba(255, 208, 0, 0.3));
}
.app-empty-title {
  font-family: 'Anton', sans-serif; font-size: 1rem;
  letter-spacing: 1.5px; color: var(--amarillo);
  text-transform: uppercase; margin-bottom: 6px;
}
.app-empty-text { font-size: 0.8rem; color: #666; }

/* ============================================================
   BOTTOM NAV — CORREGIDO PARA ANDROID
   ============================================================ */
.app-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  width: 100%;
  max-width: var(--app-max);
  margin: 0 auto;
  height: calc(var(--nav-height) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(8, 8, 8, 0.96);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-top: 1px solid rgba(255, 208, 0, 0.12);
  display: flex; align-items: center; justify-content: space-around;
  z-index: 200;
  box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
  /* Empuja el contenido por encima de la barra del sistema */
  transform: translateZ(0);
  will-change: transform;
}
.app-nav-item {
  flex: 1; height: 100%; background: none; border: none;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px; color: #666;
  font-family: inherit; font-size: 0.62rem;
  font-weight: 700; letter-spacing: 0.5px;
  text-transform: uppercase; cursor: pointer;
  transition: color 0.2s;
  position: relative; padding: 0 4px;
}
.app-nav-item i { font-size: 1.15rem; transition: transform 0.25s; }
.app-nav-item.active { color: var(--amarillo); }
.app-nav-item.active i { transform: translateY(-2px) scale(1.1); filter: drop-shadow(0 0 8px rgba(255, 208, 0, 0.6)); }
.app-nav-item.active::before {
  content: ''; position: absolute; top: 0;
  width: 28px; height: 3px;
  background: linear-gradient(90deg, var(--amarillo), var(--naranja));
  border-radius: 0 0 4px 4px;
  box-shadow: 0 0 12px var(--amarillo);
}
.app-nav-item:active i { transform: scale(0.9); }

.app-nav-badge {
  position: absolute; top: 8px;
  right: calc(50% - 22px);
  min-width: 18px; height: 18px;
  background: linear-gradient(135deg, var(--rojo), var(--naranja));
  color: #fff; font-size: 0.6rem; font-weight: 900;
  border-radius: 10px; padding: 0 5px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5), 0 0 0 2px var(--negro);
  transition: transform 0.25s;
}
.app-nav-badge.pop { animation: badgePop 0.5s ease; }
@keyframes badgePop {
  0% { transform: scale(1); }
  50% { transform: scale(1.5); }
  100% { transform: scale(1); }
}

/* ============ SHEET / DRAWER ============ */
.sheet-backdrop {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 300;
  opacity: 0; visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}
.sheet-backdrop.open { opacity: 1; visibility: visible; }

.sheet {
  position: fixed; left: 0; right: 0; bottom: 0;
  width: 100%;
  max-width: min(var(--app-max), 600px);
  margin: 0 auto;
  max-height: 92dvh;
  background: linear-gradient(180deg, #131313 0%, #0a0a0a 100%);
  border-radius: 24px 24px 0 0;
  border-top: 1px solid var(--gris-medio);
  z-index: 301;
  transform: translateY(100%);
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  display: flex; flex-direction: column;
  padding-bottom: var(--safe-bottom);
  box-shadow: 0 -20px 60px rgba(0,0,0,0.9);
}
.sheet.open { transform: translateY(0); }

.sheet-handle {
  width: 40px; height: 4px; background: #444;
  border-radius: 4px; margin: 10px auto 0; flex-shrink: 0;
}
.sheet-header {
  padding: 14px 20px 12px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--gris-oscuro); flex-shrink: 0;
}
.sheet-title {
  font-family: 'Anton', sans-serif; font-size: 1.1rem;
  letter-spacing: 0.5px; color: var(--amarillo);
  text-transform: uppercase;
  display: flex; align-items: center; gap: 8px;
}
.sheet-close {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--carbon-2); border: 1px solid var(--gris-medio);
  color: var(--gris-claro); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; font-size: 0.85rem;
}
.sheet-close:active { transform: scale(0.9); background: var(--rojo-oscuro); }

.sheet-body {
  flex: 1; overflow-y: auto;
  padding: 14px 16px 20px;
  -webkit-overflow-scrolling: touch;
}
.sheet-body::-webkit-scrollbar { width: 3px; }
.sheet-body::-webkit-scrollbar-thumb { background: var(--amarillo); border-radius: 3px; }

.cart-item {
  display: flex; gap: 10px;
  background: var(--carbon-2); border: 1px solid var(--gris-oscuro);
  border-radius: 14px; padding: 10px; margin-bottom: 10px;
  align-items: center;
  animation: itemIn 0.3s ease;
}
@keyframes itemIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.cart-item-img {
  width: 56px; height: 56px; border-radius: 10px;
  object-fit: cover; flex-shrink: 0;
  border: 1px solid var(--gris-oscuro);
}
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-name {
  font-family: 'Anton', sans-serif; font-size: 0.85rem;
  letter-spacing: 0.3px; color: var(--blanco);
  text-transform: uppercase; margin-bottom: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cart-item-price {
  font-size: 0.72rem; color: var(--naranja-brillante);
  font-weight: 700; margin-bottom: 6px;
}
.cart-item-qty { display: flex; align-items: center; gap: 8px; }
.qty-btn {
  width: 26px; height: 26px; border-radius: 8px;
  border: 1px solid var(--gris-medio);

<script>
/* ══════════════════════════════════════════════════════════════
   FIX CRÍTICO ANDROID: la barra de navegación del sistema NO se
   reporta con env(safe-area-inset-bottom), así que la detectamos
   y aplicamos un fallback. Se ejecuta ANTES de cualquier render.
   ══════════════════════════════════════════════════════════════ */
(function fixAndroidBottomBar() {
  try {
    const ua = navigator.userAgent;
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPad|iPhone|iPod/.test(ua) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    // iOS: env() funciona bien, no tocar
    if (isIOS) return;

    // Probamos el valor real de env(safe-area-inset-bottom)
    const probe = document.createElement('div');
    probe.style.cssText =
      'position:fixed;bottom:0;left:0;width:0;height:0;pointer-events:none;' +
      'padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden;';
    document.documentElement.appendChild(probe);
    const envBottom = parseFloat(getComputedStyle(probe).paddingBottom) || 0;
    document.documentElement.removeChild(probe);

    // Android típicamente devuelve 0 → aplicamos fallback
    if (isAndroid && envBottom < 5) {
      // Detectar si es un dispositivo con gesture bar (Android 10+)
      // Los de 3 botones también necesitan ~20px mínimo
      let fallback = 24; // valor seguro para gesture bar

      // Si la pantalla es muy chica, un poco menos
      if (window.innerWidth < 360) fallback = 20;

      document.documentElement.style.setProperty('--safe-bottom', fallback + 'px');
      document.documentElement.setAttribute('data-android-fix', 'true');
    }
  } catch (e) {
    // Fallback silencioso por si algo falla
    document.documentElement.style.setProperty('--safe-bottom', '20px');
  }
})();

// ================= CONFIG =================
const WHATSAPP_NUMBER = '541173642832';
const BRAND_NAME = 'MONSTER BURGER';
const DELIVERY_ZONES = ['San Miguel', 'Muñiz', 'Bella Vista']; // únicas localidades con entrega (Prov. de Buenos Aires)

// ================= PRODUCTOS (desde Google Sheets vía SheetDB) =================
const API_URL = 'https://sheetdb.io/api/v1/t0i7d5sh7kwuf';
const PRODUCTS_CACHE_KEY = 'monster-burger-products-v1';
const REFRESH_MS = 2 * 60 * 1000; // vuelve a consultar la hoja si pasaron 2 min
const PLACEHOLDER_IMG = 'https://via.placeholder.com/400/151515/FFD000?text=MB';

let allProducts = [];
let productsState = 'loading'; // loading | ready | error
let lastFetch = 0;

const CATEGORY_META = {
  promos: { label: 'Promos', emoji: '🔥' },
  hamburguesas: { label: 'Burgers', emoji: '🍔' },
  pizzas: { label: 'Pizzas', emoji: '🍕' },
  acompanamientos: { label: 'Extras', emoji: '🍟' },
  bebidas: { label: 'Bebidas', emoji: '🥤' }
};
const CATEGORY_ORDER = ['promos', 'hamburguesas', 'pizzas', 'acompanamientos', 'bebidas'];
const CATEGORY_ALIASES = {
  promo: 'promos', promos: 'promos', promocion: 'promos', promociones: 'promos',
  hamburguesa: 'hamburguesas', hamburguesas: 'hamburguesas', burger: 'hamburguesas', burgers: 'hamburguesas',
  pizza: 'pizzas', pizzas: 'pizzas',
  acompanamiento: 'acompanamientos', acompanamientos: 'acompanamientos', extra: 'acompanamientos', extras: 'acompanamientos',
  bebida: 'bebidas', bebidas: 'bebidas'
};
let categoryMeta = { ...CATEGORY_META };

// --- Helpers de lectura de la hoja ---
function escapeHTML(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function keyify(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
}
function rowToMap(row) {
  const m = {};
  Object.keys(row).forEach(k => { m[keyify(k)] = row[k]; });
  return m;
}
function pick(m, names) {
  for (const n of names) {
    const v = m[keyify(n)];
    if (v !== undefined && v !== null && String(v).trim() !== '') return String(v).trim();
  }
  return '';
}
// Acepta: 8.90 | 8,90 | 8900 | 8.900 | 8.900,50 | $ 8,900.50
function parsePrice(raw) {
  let s = String(raw).replace(/[^\d.,]/g, '');
  if (!s) return 0;
  const lastDot = s.lastIndexOf('.'), lastComma = s.lastIndexOf(',');
  if (lastDot > -1 && lastComma > -1) {
    const dec = lastDot > lastComma ? '.' : ',';
    const th = dec === '.' ? ',' : '.';
    s = s.split(th).join('').replace(dec, '.');
  } else if (lastComma > -1) {
    s = /,\d{3}$/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.');
  } else if (lastDot > -1) {
    if (/\.\d{3}$/.test(s) || (s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function isAvailable(m) {
  const act = pick(m, ['Activo', 'Disponible', 'Visible', 'Estado']);
  if (act && /^(no|n|false|falso|0|inactivo|oculto|agotado|sinstock)$/.test(keyify(act))) return false;
  const st = pick(m, ['Stock', 'Cantidad']);
  if (st !== '' && !isNaN(parseInt(st, 10)) && parseInt(st, 10) <= 0) return false;
  return true;
}
function normalizeCategory(raw) {
  const k = keyify(raw || '');
  if (!k) return 'otros';
  return CATEGORY_ALIASES[k] || k;
}
function safeId(raw, idx, used) {
  let id = String(raw || '').trim().replace(/[^\w-]/g, '_') || ('p' + (idx + 1));
  while (used.has(id)) id += '_' + idx;
  used.add(id);
  return id;
}

function parseProducts(data) {
  const used = new Set();
  const out = [];
  categoryMeta = { ...CATEGORY_META };
  data.forEach((row, idx) => {
    const m = rowToMap(row);
    const name = pick(m, ['Nombre', 'Producto', 'Name']);
    const price = parsePrice(pick(m, ['Precio', 'Price']));
    if (!name || price <= 0 || !isAvailable(m)) return; // ignora filas incompletas / ocultas / sin stock

    const catRaw = pick(m, ['Categoria', 'Category']);
    const category = normalizeCategory(catRaw);
    if (!categoryMeta[category]) {
      const label = (catRaw || 'Otros').replace(/\b\w/g, l => l.toUpperCase());
      categoryMeta[category] = { label, emoji: '🍽️' };
    }

    let img = pick(m, ['Imagen', 'URL Imagen', 'Foto', 'Img', 'Image']);
    if (!/^https?:\/\//i.test(img)) img = PLACEHOLDER_IMG;

    const badge = pick(m, ['Badge', 'Etiqueta', 'Insignia']);
    const bt = keyify(pick(m, ['TipoBadge', 'Tipo Badge']));
    out.push({
      id: safeId(pick(m, ['ID', 'Codigo']), idx, used),
      name, category, price, img,
      desc: pick(m, ['Descripcion', 'Detalle', 'Description']),
      badge,
      badgeType: bt === 'new' ? 'new' : 'hot'
    });
  });
  return out;
}

// --- Tarjetas destacadas = productos de la categoría Promociones ---
function renderPromoCarousel() {
  const box = document.getElementById('promoCarousel');
  if (!box) return;
  const promos = allProducts.filter(p => p.category === 'promos');
  if (!promos.length) {            // sin promociones -> se oculta toda la sección
    box.classList.add('is-empty');
    box.innerHTML = '';
    box.removeAttribute('data-count');
    return;
  }
  box.dataset.count = Math.min(promos.length, 3);
  box.innerHTML = promos.map(p => `
    <div class="app-feature" data-id="${escapeHTML(p.id)}" role="button" tabindex="0">
      <img src="${escapeHTML(p.img)}" alt="${escapeHTML(p.name)}" onerror="this.src='${PLACEHOLDER_IMG}'">
      <div class="app-feature-tag">${escapeHTML(p.badge || 'Promo')}</div>
      <div class="app-feature-label">${escapeHTML(p.name)}<span class="app-feature-price">${formatPrice(p.price)}</span></div>
    </div>`).join('');
  box.classList.remove('is-empty');
}
function initPromoCarousel() {
  const box = document.getElementById('promoCarousel');
  if (!box) return;
  const go = (e) => {
    if (!e.target.closest('.app-feature')) return;
    if (e.type === 'keydown' && e.key !== 'Enter') return;
    currentCategory = 'promos';
    searchTerm = '';
    document.getElementById('searchInput').value = '';
    renderCategories();
    renderMenu();
    scrollToMenu();
  };
  box.addEventListener('click', go);
  box.addEventListener('keydown', go);
}

// --- Carga desde la API ---
async function loadProducts(showSpinner = true) {
  if (showSpinner && !allProducts.length) { productsState = 'loading'; renderMenu(); }
  try {
    const res = await fetch(API_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error((data && data.error) || 'Respuesta inválida');
    try { localStorage.setItem(PRODUCTS_CACHE_KEY, JSON.stringify(data)); } catch (e) {}
    applyProducts(data, true);
    lastFetch = Date.now();
  } catch (err) {
    console.error('Error cargando productos:', err);
    if (!allProducts.length) { productsState = 'error'; renderMenu(); }
  }
}
function loadCachedProducts() {
  try {
    const cached = JSON.parse(localStorage.getItem(PRODUCTS_CACHE_KEY));
    if (Array.isArray(cached) && cached.length) applyProducts(cached, false);
  } catch (e) {}
}
function applyProducts(data, fresh) {
  allProducts = parseProducts(data);
  productsState = 'ready';
  renderCategories();
  renderPromoCarousel();
  if (fresh) syncCartWithProducts();
  renderMenu();
  if (document.getElementById('cartSheet')?.classList.contains('open')) renderCartSheet();
}
// Actualiza precios/nombres del carrito con los de la hoja y quita lo que ya no existe
function syncCartWithProducts() {
  if (!cart.length) return;
  const before = cart.length;
  let changed = false;
  cart = cart.filter(i => allProducts.some(p => p.id === i.id));
  cart.forEach(i => {
    const p = allProducts.find(x => x.id === i.id);
    if (i.price !== p.price || i.name !== p.name || i.img !== p.img) {
      i.price = p.price; i.name = p.name; i.img = p.img; changed = true;
    }
  });
  if (cart.length !== before) {
    showToast('Quitamos productos que ya no están disponibles', 'fa-exclamation-circle');
    changed = true;
  }
  if (changed) { saveCart(); updateCartBadges(); }
}
function renderCategories() {
  const wrap = document.querySelector('#appCats .app-cats-scroll');
  if (!wrap) return;
  const keys = [...new Set(allProducts.map(p => p.category))].sort((a, b) => {
    const ia = CATEGORY_ORDER.indexOf(a), ib = CATEGORY_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  if (!keys.length) { wrap.innerHTML = ''; return; }
  if (!keys.includes(currentCategory)) currentCategory = keys[0];
  const searching = searchTerm.trim() !== '';
  wrap.innerHTML = keys.map(k => `
    <button class="app-cat ${k === currentCategory && !searching ? 'active' : ''}" data-category="${escapeHTML(k)}">
      <span class="emoji">${categoryMeta[k].emoji}</span> ${escapeHTML(categoryMeta[k].label)}
    </button>`).join('');
}

// ================= ESTADO =================
let cart = [];
let currentCategory = "promos";
let searchTerm = "";
let activeTab = "home";

// ================= UTILS =================
function normalizeText(t) {
  return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9\s]/g, "");
}
function matchesSearch(p, term) {
  if (!term.trim()) return true;
  const n = normalizeText(term);
  return normalizeText(p.name).includes(n) || normalizeText(p.desc).includes(n);
}
function getProductsByCategory(cat) {
  return allProducts.filter(p => p.category === cat);
}
function getFilteredProducts() {
  return searchTerm.trim() !== ""
    ? allProducts.filter(p => matchesSearch(p, searchTerm))
    : getProductsByCategory(currentCategory);
}
function formatPrice(p) {
  const dec = Number.isInteger(p) ? 0 : 2;
  return `$ ${p.toLocaleString('es-AR', { minimumFractionDigits: dec, maximumFractionDigits: 2 })}`;
}
function getTotal() { return cart.reduce((s, i) => s + i.price * i.quantity, 0); }
function getTotalItems() { return cart.reduce((s, i) => s + i.quantity, 0); }

let toastTimeout;
function showToast(msg, icon = 'fa-check-circle') {
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  const toastIcon = toast.querySelector('i');
  toastMsg.textContent = msg;
  toastIcon.className = `fas ${icon}`;
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
}

function haptic(strong = false) {
  const nav = document.querySelector(`.app-nav-item[data-tab="cart"]`);
  if (nav && window.getComputedStyle(nav).display !== 'none') {
    nav.style.transform = strong ? 'scale(0.9)' : 'scale(0.95)';
    setTimeout(() => nav.style.transform = '', 120);
  }
}

function saveCart() { localStorage.setItem('monster-burger-cart-v2', JSON.stringify(cart)); }
function loadCart() {
  const saved = localStorage.getItem('monster-burger-cart-v2');
  if (saved) { try { cart = JSON.parse(saved); } catch(e) { cart = []; } }
  updateCartBadges();
}

function addToCart(product) {
  const existing = cart.find(i => i.id === product.id);
  if (existing) {
    existing.quantity++;
    showToast(`+1 ${product.name}`, 'fa-plus-circle');
  } else {
    cart.push({ id: product.id, name: product.name, price: product.price, quantity: 1, img: product.img });
    showToast(`${product.name} agregado`, 'fa-check-circle');
  }
  saveCart();
  updateCartBadges();
  haptic(true);
  animateNavBadge();
}
function updateQuantity(id, delta) {
  const idx = cart.findIndex(i => i.id === id);
  if (idx === -1) return;
  const q = cart[idx].quantity + delta;
  if (q <= 0) { cart.splice(idx, 1); showToast('Producto eliminado', 'fa-trash'); }
  else { cart[idx].quantity = q; }
  saveCart(); updateCartBadges(); renderCartSheet();
}
function removeItem(id) {
  const p = cart.find(i => i.id === id);
  cart = cart.filter(i => i.id !== id);
  showToast(`${p?.name || 'Producto'} eliminado`, 'fa-trash');
  saveCart(); updateCartBadges(); renderCartSheet();
}
function clearCart() {
  if (cart.length === 0) return;
  if (confirm('¿Vaciar el pedido completo?')) {
    cart = []; saveCart(); updateCartBadges(); renderCartSheet();
    showToast('Carrito vaciado', 'fa-trash');
  }
}

function updateCartBadges() {
  const total = getTotalItems();
  const navBadge = document.getElementById('navCartBadge');
  const headerDot = document.getElementById('headerCartDot');
  if (total > 0) {
    navBadge.textContent = total > 99 ? '99+' : total;
    navBadge.style.display = 'flex';
    headerDot.style.display = 'block';
  } else {
    navBadge.style.display = 'none';
    headerDot.style.display = 'none';
  }
}
function animateNavBadge() {
  const navBadge = document.getElementById('navCartBadge');
  navBadge.classList.remove('pop');
  void navBadge.offsetWidth;
  navBadge.classList.add('pop');
}

function renderMenu() {
  const list = document.getElementById('menuList');
  if (productsState === 'loading') {
    list.innerHTML = `<div class="app-empty"><div class="app-empty-emoji">🍔</div><div class="app-empty-title">Cargando el menú...</div><div class="app-empty-text">Un segundo, estamos trayendo los productos</div></div>`;
    return;
  }
  if (productsState === 'error') {
    list.innerHTML = `<div class="app-empty"><div class="app-empty-emoji">⚠️</div><div class="app-empty-title">No pudimos cargar el menú</div><div class="app-empty-text">Revisá tu conexión e intentá de nuevo</div><button class="app-btn app-btn-primary" onclick="loadProducts()" style="max-width:200px; margin: 14px auto 0;">Reintentar</button></div>`;
    return;
  }
  const products = getFilteredProducts();

  if (products.length === 0) {
    list.innerHTML = `
      <div class="app-empty">
        <div class="app-empty-emoji">👹</div>
        <div class="app-empty-title">Nada por acá</div>
        <div class="app-empty-text">Probá con otra búsqueda o categoría</div>
      </div>`;
    return;
  }

  const categoryNames = {};
  Object.keys(categoryMeta).forEach(k => categoryNames[k] = categoryMeta[k].label);
  const sectionTitle = searchTerm.trim()
    ? `Resultados (${products.length})`
    : `Las ${categoryNames[currentCategory] || 'estrellas'} del monstruo`;

  let html = `<div class="app-section-title"><span>👹</span> ${sectionTitle}</div>`;

  products.forEach(p => {
    let badgeHTML = '';
    if (p.badge) badgeHTML = `<div class="product-badge ${p.badgeType || ''}">${escapeHTML(p.badge)}</div>`;
    html += `
      <div class="product-item">
        <div class="product-thumb">
          ${badgeHTML}
          <img src="${escapeHTML(p.img)}" alt="${escapeHTML(p.name)}" loading="lazy" onerror="this.src='https://via.placeholder.com/400/151515/FFD000?text=MB'">
        </div>
        <div class="product-info">
          <div class="product-name">${escapeHTML(p.name)}</div>
          <div class="product-desc">${escapeHTML(p.desc)}</div>
          <div class="product-bottom">
            <div class="product-price">${formatPrice(p.price)}</div>
            <button class="product-add" data-id="${escapeHTML(p.id)}" aria-label="Agregar">
              <i class="fas fa-plus"></i>
            </button>
          </div>
        </div>
      </div>`;
  });

  list.innerHTML = html;
  document.querySelectorAll('.product-add').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const p = allProducts.find(x => x.id === btn.dataset.id);
      if (p) addToCart(p);
    });
  });
}

function renderCartSheet() {
  const body = document.getElementById('cartSheetBody');
  if (cart.length === 0) {
    body.innerHTML = `
      <div class="cart-empty">
        <div class="cart-empty-emoji">🛒</div>
        <div class="cart-empty-title">Tu pedido está vacío</div>
        <div class="cart-empty-text">Agregá tus hamburguesas favoritas</div>
        <button class="app-btn app-btn-primary" onclick="closeCartSheet(); scrollToMenu();" style="max-width:200px; margin: 0 auto;">
          <i class="fas fa-utensils"></i> Ver menú
        </button>
      </div>`;
    return;
  }

  let html = '';
  cart.forEach(item => {
    const sub = item.price * item.quantity;
    html += `
      <div class="cart-item">
        <img class="cart-item-img" src="${escapeHTML(item.img)}" alt="${escapeHTML(item.name)}" onerror="this.src='https://via.placeholder.com/60/151515/FFD000?text=MB'">
        <div class="cart-item-info">
          <div class="cart-item-name">${escapeHTML(item.name)}</div>
          <div class="cart-item-price">${formatPrice(item.price)} c/u</div>
          <div class="cart-item-qty">
            <button class="qty-btn" onclick="updateQuantity('${item.id}', -1)">−</button>
            <span class="qty-num">${item.quantity}</span>
            <button class="qty-btn plus" onclick="updateQuantity('${item.id}', 1)">+</button>
          </div>
        </div>
        <div class="cart-item-right">
          <div class="cart-item-subtotal">${formatPrice(sub)}</div>
          <button class="cart-item-remove" onclick="removeItem('${item.id}')">
            <i class="fas fa-trash-alt"></i>
          </button>
        </div>
      </div>`;
  });

  html += `
    <div class="cart-summary">
      <div class="cart-summary-row">
        <span>${getTotalItems()} item${getTotalItems() > 1 ? 's' : ''}</span>
        <span>${formatPrice(getTotal())}</span>
      </div>
      <div class="cart-summary-total">
        <span class="label">Total</span>
        <span class="value">${formatPrice(getTotal())}</span>
      </div>
    </div>

    <div style="margin-top: 18px;">
      <div class="form-field">
        <label><i class="fas fa-user"></i> Nombre *</label>
        <input type="text" id="customer-name" placeholder="Tu nombre" autocomplete="off">
      </div>
      <div class="form-field">
        <label><i class="fab fa-whatsapp"></i> Teléfono *</label>
        <input type="tel" id="customer-phone" placeholder="11 1234-5678" autocomplete="off">
      </div>
      <div class="form-field">
        <label><i class="fas fa-home"></i> Dirección *</label>
        <select id="shipping-zone" style="margin-bottom: 8px;">
          <option value="">Localidad (solo zona de entrega)...</option>
          <option value="San Miguel">📍 San Miguel</option>
          <option value="Muñiz">📍 Muñiz</option>
          <option value="Bella Vista">📍 Bella Vista</option>
        </select>
        <input type="text" id="shipping-address" placeholder="Calle y número (ej: Paunero 1234)" autocomplete="off">
        <div style="font-size: 0.7rem; color: #888; margin-top: 6px;">🛵 Entregamos solo en San Miguel, Muñiz y Bella Vista (Buenos Aires).</div>
      </div>
      <div class="form-field">
        <label><i class="fas fa-credit-card"></i> Pago *</label>
        <select id="payment-method">
          <option value="">Seleccionar...</option>
          <option value="Transferencia">📲 Transferencia</option>
          <option value="Efectivo">💵 Efectivo</option>
          <option value="Mercado Pago">🟡 Mercado Pago</option>
        </select>
      </div>
      <div class="form-field">
        <label><i class="fas fa-pen"></i> Notas (opcional)</label>
        <textarea id="customer-notes" rows="2" placeholder="Ej: sin cebolla, timbre 3B..."></textarea>
      </div>
    </div>

    <div class="sheet-actions">
      <button class="app-btn app-btn-ghost" onclick="clearCart()" style="flex: 0 0 90px;">
        <i class="fas fa-trash-alt"></i>
      </button>
      <button class="app-btn app-btn-primary" onclick="checkout()">
        <i class="fab fa-whatsapp"></i> Enviar pedido
      </button>
    </div>`;
  body.innerHTML = html;
}

function formatDateAR() {
  const now = new Date();
  return now.toLocaleDateString('es-AR', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
    hour: '2-digit', minute: '2-digit'
  }).replace(/\b\w/g, l => l.toUpperCase());
}
function checkout() {
  if (cart.length === 0) { showToast('El carrito está vacío', 'fa-exclamation-circle'); return; }
  const name = document.getElementById('customer-name')?.value.trim();
  const phone = document.getElementById('customer-phone')?.value.trim();
  const street = document.getElementById('shipping-address')?.value.trim();
  const zone = document.getElementById('shipping-zone')?.value;
  const pay = document.getElementById('payment-method')?.value;
  const notes = document.getElementById('customer-notes')?.value.trim();

  if (!zone || !DELIVERY_ZONES.includes(zone)) {
    showToast('Elegí tu localidad: San Miguel, Muñiz o Bella Vista', 'fa-map-marker-alt');
    return;
  }
  if (!name || !phone || !street || !pay) {
    showToast('Completá todos los campos', 'fa-exclamation-circle');
    return;
  }
  const addr = `${street}, ${zone}, Buenos Aires`;

  let msg = `🛒 *NUEVO PEDIDO - ${BRAND_NAME}*\n\n`;
  msg += "👤 *CLIENTE*\n";
  msg += `• ${name}\n• ${phone}\n• ${addr}\n• ${pay}\n`;
  if (notes) msg += `• ${notes}\n`;
  msg += "\n📦 *PEDIDO*\n\n";
  let sub = 0;
  cart.forEach((i, idx) => {
    const s = i.price * i.quantity;
    sub += s;
    msg += `${idx + 1}. ${i.name} ×${i.quantity} = ${formatPrice(s)}\n`;
  });
  msg += `\n💰 *TOTAL: ${formatPrice(sub)}*\n\n`;
  msg += `📅 ${formatDateAR()}\n\n`;
  msg += "¡Gracias! 👹 Te contactamos para confirmar.";
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
}

function openCartSheet() {
  renderCartSheet();
  document.getElementById('sheetBackdrop').classList.add('open');
  document.getElementById('cartSheet').classList.add('open');
  document.body.style.overflow = 'hidden';
  haptic(false);
}
function closeCartSheet() {
  document.getElementById('sheetBackdrop').classList.remove('open');
  document.getElementById('cartSheet').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCartSheet(); });

function initCats() {
  const wrap = document.querySelector('#appCats .app-cats-scroll');
  if (!wrap) return;
  wrap.addEventListener('click', (e) => {
    const btn = e.target.closest('.app-cat');
    if (!btn) return;
    currentCategory = btn.dataset.category;
    searchTerm = '';
    document.getElementById('searchInput').value = '';
    wrap.querySelectorAll('.app-cat').forEach(b => b.classList.toggle('active', b === btn));
    renderMenu();
    document.getElementById('menuList').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}
function initSearch() {
  const input = document.getElementById('searchInput');
  input.addEventListener('input', (e) => {
    searchTerm = e.target.value;
    if (searchTerm.trim()) {
      document.querySelectorAll('.app-cat').forEach(b => b.classList.remove('active'));
    } else {
      document.querySelector(`.app-cat[data-category="${currentCategory}"]`)?.classList.add('active');
    }
    renderMenu();
  });
}
function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.app-nav-item, .nav-link').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  if (tab === 'home') window.scrollTo({ top: 0, behavior: 'smooth' });
  if (tab === 'menu') scrollToMenu();
  if (tab === 'profile') showToast('Próximamente: tu perfil', 'fa-user');
}
function scrollToMenu() {
  document.getElementById('appCats').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function initHeaderScroll() {
  const header = document.getElementById('appBar');
  window.addEventListener('scroll', () => {
    header.classList.toggle('scrolled', window.scrollY > 20);
  }, { passive: true });
}
function initSheetSwipe() {
  const sheet = document.getElementById('cartSheet');
  let startY = 0, currentY = 0, dragging = false;
  sheet.addEventListener('touchstart', (e) => {
    if (window.innerWidth >= 900) return;
    const body = sheet.querySelector('.sheet-body');
    if (body && body.scrollTop > 0) return;
    startY = e.touches[0].clientY;
    dragging = true;
  }, { passive: true });
  sheet.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    if (window.innerWidth >= 900) return;
    currentY = e.touches[0].clientY - startY;
    if (currentY > 0) {
      sheet.style.transform = `translateY(${Math.min(currentY, 250)}px)`;
      sheet.style.transition = 'none';
    }
  }, { passive: true });
  sheet.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = '';
    sheet.style.transform = '';
    if (currentY > 120) closeCartSheet();
    currentY = 0;
  });
}
function hideSplash() {
  setTimeout(() => document.getElementById('splash').classList.add('hidden'), 1400);
}
function init() {
  hideSplash();
  initCats();
  initPromoCarousel();
  initSearch();
  initHeaderScroll();
  initSheetSwipe();
  loadCart();
  loadCachedProducts();   // muestra el último menú guardado al instante
  renderMenu();
  loadProducts();         // y lo actualiza con la hoja de Google
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Date.now() - lastFetch > REFRESH_MS) loadProducts(false);
  });
}
init();
</script>
